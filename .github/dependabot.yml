# EleSync Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (pyproject.toml)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      dev-dependencies:
        patterns:
          - "ruff"
          - "mypy"
          - "pre-commit"
          - "pytest*"
          - "httpx*"
        update-types:
          - "minor"
          - "patch"
      core-dependencies:
        patterns:
          - "mcp"
          - "pynacl"
          - "bcrypt"
          - "cryptography"
        update-types:
          - "minor"
          - "patch"
    # Don't auto-merge major version bumps
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    # Labels for PR organization
    labels:
      - "dependencies"
      - "python"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "github-actions"
