name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths: [index.html, CNAME, .github/workflows/pages.yml, scripts/verify_site.py]
  workflow_dispatch:

# Allow only one concurrent deployment; don't cancel in-progress runs.
# New pushes queue behind the current deployment instead of colliding --
# this is what actually fixed the "Deployment failed, try again later"
# error from the old dynamic pipeline (PR #86), and it's kept as-is here.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stage only the actual public site (not the whole repo)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp CNAME _site/
          # index.html is self-contained, so there is nothing else the deployed
          # site needs. No Jekyll: the
          # site is one static file, and running the whole repo (source,
          # tests, examples, a 2.7MB demo gif) through Jekyll on every push
          # added build time and a class of failure ("Deploy" step choking
          # on an unrelated repo file) with zero benefit to the actual site.
          touch _site/.nojekyll
          echo "Staged site contents:"
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify deployed page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 5 "$PAGE_URL" -D headers.txt -o deployed.html
          python scripts/verify_site.py --body deployed.html --headers headers.txt
